name: arashmati_app
description: Sweden Citizenship Test App
publish_to: 'none'
version: 1.0.3+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3
  fl_chart: ^1.0.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  shimmer: ^3.0.0
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  firebase_auth: ^6.0.2
  flutter_local_notifications: ^19.4.2
  purchases_flutter: ^10.6.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/ios_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  image_path: "assets/images/ios_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/ios_logo.png

  android: true
  ios: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/ios_logo.png

  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
