name: arashmati_app
description: Sweden Citizenship Test App
publish_to: 'none'
version: 1.0.7+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3
  fl_chart: ^1.0.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  shimmer: ^3.0.0
  firebase_core: 3.15.2
  firebase_auth: 5.7.0
  firebase_messaging: 15.2.10
  flutter_local_notifications: ^19.4.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  purchases_flutter: ^10.6.0
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/tapass-logo-1024.png"
  adaptive_icon_background: "#1D345B"
  adaptive_icon_foreground: "assets/images/tapass-logo-1024-transparent.png"
  web:
    generate: true
    image_path: "assets/images/tapass-logo-1024.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - .env
